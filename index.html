<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo secreto - Digital</title>
<meta name="description" content="Amigo secreto online: cada pessoa sorteia o seu nome e conta o que quer ganhar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173d31'/%3E%3Cpath d='M32 12c2 12 8 18 20 20-12 2-18 8-20 20-2-12-8-18-20-20 12-2 18-8 20-20z' fill='%23e9c27c'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f9f6f0; --card:#fffdf8; --line:#ebe5d9; --verde:#173d31; --verde2:#1f5c45; --verde-claro:#e6f0ea;
  --vermelho:#b9483f; --vermelho-claro:#f8e6e1; --ouro:#e9c27c; --ouro-claro:#f6edd5; --texto:#25342e; --suave:#5f6964;
  --raio:18px; --sombra:0 2px 6px -2px rgba(30,40,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--texto);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--verde)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.estreito{max-width:640px;margin:0 auto}
/* topo */
header.top{background:#fffdf9;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:20px;color:var(--verde);letter-spacing:-.3px}
.logo .mk{width:40px;height:40px;border-radius:10px;background:var(--verde);display:grid;place-items:center;flex:none}
.logo b{color:var(--vermelho);font-weight:700}
.top-acoes{display:flex;gap:8px;align-items:center}
/* textos */
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--vermelho);font-weight:700;letter-spacing:0;font-size:17px;margin:0 0 10px}
h1,h2,h3{color:var(--verde);line-height:1.1;margin:0}
h1{font-size:clamp(36px,7vw,64px);letter-spacing:-1.5px}
h2{font-size:clamp(28px,5vw,42px);letter-spacing:-1px}
h3{font-size:24px;letter-spacing:-.3px}
.sub{color:var(--suave);margin:8px 0 0}
section{padding:36px 0}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:16px 26px;font-weight:700;font-size:20px;cursor:pointer;text-decoration:none;min-height:60px;transition:transform .1s,background .12s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-verde{background:var(--verde2);color:#fff;box-shadow:0 10px 20px -12px rgba(31,92,69,.9)}
.btn-verde:hover{background:#184b38}
.btn-borda{background:#fff;color:var(--verde);border:2px solid #cfd8d2}
.btn-vermelho{background:var(--vermelho);color:#fff}
.btn-ouro{background:var(--ouro);color:var(--verde)}
.btn-full{width:100%}
.btn-peq{padding:10px 16px;min-height:44px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-sim{background:none;border:0;color:var(--verde);font-weight:700;cursor:pointer;text-decoration:underline;padding:10px 4px;font-size:17px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:26px;box-shadow:var(--sombra)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 14px;font-size:15px;font-weight:600;background:var(--verde-claro);color:var(--verde)}
.pill.r{background:var(--vermelho-claro);color:var(--vermelho)} .pill.o{background:var(--ouro-claro);color:#7c5913} .pill.c{background:#efebe3;color:var(--suave)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.aviso{border-radius:16px;padding:16px 18px;margin-top:16px;font-size:17px}
.aviso.r{background:var(--vermelho-claro);color:#8c2f28} .aviso.v{background:var(--verde-claro);color:var(--verde)} .aviso.o{background:var(--ouro-claro);color:#6a4c10}
/* botão grande "Quem sou eu" */
.grande{display:flex;align-items:center;gap:20px;width:100%;border:0;border-radius:26px;padding:28px 26px;background:var(--verde2);color:#fff;cursor:pointer;text-align:left;box-shadow:none;text-decoration:none;margin-top:26px}
.grande:active{transform:scale(.99)}
.grande .ic{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.grande b{display:block;font-size:clamp(28px,6vw,38px);line-height:1.1}
.grande .tx{display:block;color:#fff}
.grande .tx span{display:block;color:#cfe2d8;font-size:18px;margin-top:6px}
/* informações grandes */
.infos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.infos div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.infos small{display:block;color:var(--suave);font-size:16px;font-weight:600}
.infos b{display:block;color:var(--verde);font-size:clamp(24px,5.5vw,34px);line-height:1.15;margin-top:2px;word-break:break-word}
/* lista de pedidos */
.pedidos{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:20px}
.pedido h3{font-size:26px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pedido .nada{color:var(--suave);font-style:italic;margin-top:10px}
.itens{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.itens li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.itens li.fav{border-color:#e3c07e;background:#fffaee}
.itens .t{font-weight:600;font-size:19px;white-space:pre-wrap;word-break:break-word}
.loja{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--verde2);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:10px 16px;font-size:17px}
.loja small{font-weight:500;opacity:.8}
.tams{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tams span{background:#f2ede3;border-radius:12px;padding:8px 12px;font-size:16px;color:var(--suave)}
.tams b{color:var(--verde);font-size:19px}
.surp{display:flex;gap:12px;align-items:center;background:var(--verde-claro);color:var(--verde);border-radius:16px;padding:14px 16px;margin-top:12px;font-weight:700;font-size:19px}
.dica{margin:12px 0 0;color:var(--texto)} .dica b{color:var(--verde)}
/* nomes */
.nomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
.nome-btn{border:2px solid var(--line);background:#fff;border-radius:20px;padding:24px 22px;font-weight:800;font-size:26px;color:var(--verde);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--sombra)}
.nome-btn:hover,.nome-btn:focus{border-color:var(--verde2)}
.nome-btn small{font-size:15px;font-weight:600;color:var(--suave)}
/* teclado da senha */
.pontos{display:flex;gap:18px;justify-content:center;margin:24px 0}
.pontos i{width:26px;height:26px;border-radius:50%;border:3px solid var(--verde2);display:block}
.pontos i.on{background:var(--verde2)}
.pontos.erro{animation:treme .35s}
@keyframes treme{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:0 auto}
.teclado button{height:76px;border-radius:20px;border:2px solid var(--line);background:#fff;font-size:34px;font-weight:700;color:var(--verde);cursor:pointer;box-shadow:0 8px 16px -12px rgba(0,0,0,.3)}
.teclado button:active{background:var(--verde-claro)}
.teclado .apagar{font-size:20px;color:var(--vermelho)}
/* sorteio */
.sorteio{background:var(--verde);color:#fff;border-radius:30px;padding:40px 22px;text-align:center;position:relative;overflow:hidden}
.sorteio small{font-weight:700;color:var(--ouro);font-size:20px}
.sorteio .quem{font-size:clamp(46px,12vw,84px);font-weight:800;letter-spacing:-2px;margin:10px 0 6px;line-height:1.05;word-break:break-word}
.sorteio p{color:#cfe2d8;margin:0;font-size:18px}
.roleta{height:110px;display:grid;place-items:center;font-size:clamp(40px,10vw,70px);font-weight:800;margin:14px 0}
.presente-btn{background:none;border:0;cursor:pointer;display:block;margin:10px auto 0;animation:pula 1.4s ease-in-out infinite}
@keyframes pula{50%{transform:translateY(-10px) rotate(-3deg)}}
.confete{position:absolute;width:10px;height:16px;top:-20px;border-radius:2px;animation:cai 2.4s linear forwards}
@keyframes cai{to{transform:translateY(560px) rotate(720deg);opacity:0}}
/* editor */
.escolha{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.escolha button{border:3px solid var(--line);background:#fff;border-radius:20px;padding:20px 14px;cursor:pointer;text-align:center;font-weight:800;font-size:20px;color:var(--verde)}
.escolha button span{display:block;font-size:38px}
.escolha button small{display:block;font-weight:500;font-size:15px;color:var(--suave);margin-top:4px}
.escolha button.on{border-color:var(--verde2);background:var(--verde-claro)}
.item-ed{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.item-ed .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.item-ed .cab b{color:var(--verde);font-size:20px}
textarea,input[type=text],input[type=url],input[type=password],input[type=date]{width:100%;padding:16px;border:2px solid #d9d3c6;border-radius:14px;background:#fff;font-size:19px;outline:none}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{border-color:var(--verde2);box-shadow:0 0 0 4px rgba(31,92,69,.12)}
.item-ed input{margin-top:10px}
.fav-btn{border:2px solid #e3c07e;background:#fff;color:#7c5913;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:16px}
.fav-btn.on{background:#fbe9c2}
.apagar-btn{border:0;background:none;color:var(--vermelho);font-weight:700;cursor:pointer;font-size:16px;padding:8px}
.grade{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.grade button{min-width:62px;height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:19px;color:var(--verde);cursor:pointer;padding:0 12px}
.grade button.on{background:var(--verde2);border-color:var(--verde2);color:#fff}
.rotulo{display:block;font-weight:800;color:var(--verde);font-size:20px;margin-top:22px}
.rotulo small{font-weight:500;color:var(--suave);font-size:16px}
.salvar-barra{position:sticky;bottom:0;padding:18px 0 14px;background:linear-gradient(transparent,var(--bg) 30%)}
/* organizador */
.abas{display:flex;gap:6px;background:#efeadf;border-radius:16px;padding:6px;margin:22px 0;overflow-x:auto}
.aba{flex:1;border:0;background:none;padding:12px 14px;border-radius:12px;font-weight:700;color:var(--suave);cursor:pointer;white-space:nowrap;font-size:17px}
.aba.ativo{background:#fff;color:var(--verde);box-shadow:0 4px 10px -6px rgba(0,0,0,.3)}
.adm-lista{display:grid;gap:8px;margin-top:14px}
.adm-item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.adm-item input{border:0;padding:8px;font-weight:600;min-width:0;box-shadow:none}
.adm-item .n{width:32px;height:32px;border-radius:50%;background:var(--verde-claro);color:var(--verde);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.x{background:none;border:0;color:var(--vermelho);font-weight:700;cursor:pointer;padding:8px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:17px}
.chip.bloq{background:var(--vermelho-claro);border-color:var(--vermelho);color:var(--vermelho)}
.rest-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.status-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;flex-wrap:wrap;margin-top:8px}
.link-box{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.link-box input{flex:1;min-width:220px;font-size:16px;padding:12px}
.grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:20px}
.check{display:flex;gap:12px;align-items:center;cursor:pointer;margin-top:14px;font-weight:600}
.check input{width:26px;height:26px;accent-color:var(--verde2);flex:none}
/* geral */
footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0;color:var(--suave);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);opacity:0;pointer-events:none;background:var(--verde);color:#fff;padding:16px 24px;border-radius:16px;font-weight:700;z-index:99;transition:transform .25s,opacity .25s;max-width:92vw;font-size:18px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.erro{background:var(--vermelho)}
#loading{position:fixed;inset:0;background:rgba(249,246,240,.75);display:none;place-items:center;z-index:98}
#loading.show{display:grid}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--verde-claro);border-top-color:var(--verde2);animation:g .8s linear infinite;margin:0 auto}
@keyframes g{to{transform:rotate(360deg)}}
.carregando{padding:110px 0;text-align:center;color:var(--suave)}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.45);display:grid;place-items:center;z-index:97;padding:20px}
.modal{background:var(--card);border-radius:22px;padding:26px;max-width:460px;width:100%}
.modal .acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.voltar{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;color:var(--verde);font-size:19px;padding:12px 0;background:none;border:0;cursor:pointer}
@media (max-width:560px){
  .infos{grid-template-columns:1fr 1fr} .infos div:first-child{grid-column:1/-1}
  html,body{font-size:18px}
  .wrap{padding:0 16px}
  .card{padding:20px}
  .logo{font-size:17px} .logo .mk{width:36px;height:36px}
  .grande{padding:22px 18px;gap:14px} .grande .ic{width:60px;height:60px;font-size:34px}
  .pedidos{grid-template-columns:1fr}
  .nomes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" id="logo" href="#/">
    <span class="mk"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2c.8 5 3.2 7.6 8.5 10-5.3 2.4-7.7 5-8.5 10-.8-5-3.2-7.6-8.5-10C8.8 9.6 11.2 7 12 2z" fill="#e9c27c"/></svg></span>
    <span>Amigo secreto <b>- Digital</b></span>
  </a>
  <div class="top-acoes" id="topAcoes"></div>
</div></header>

<main id="app"><div class="carregando"><div class="spin"></div></div></main>

<footer><div class="wrap"><span>Amigo secreto - Digital</span><span id="versao"></span></div></footer>
<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>

<script>
/* =====================================================================
   COLE AQUI A URL DO APPS SCRIPT (termina em /exec)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyrVqPCZ4W0kkWjv-k2zXGRDW1KOQDQAuVmP4BlkDuKQBft5hx6xTNQl7cvhj23bIpo/exec';

const VERSAO = '2.1.0';
document.getElementById('versao').textContent = 'Versão ' + VERSAO;

/* ---------- utilidades ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const SS = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };
let toastT;
function toast(msg, erro){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (erro ? ' erro' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = erro ? 'erro' : '', 4500);
}
function carregando(on){ document.getElementById('loading').classList.toggle('show', !!on); }
async function api(acao, dados = {}, silencioso){
  if (!API_URL || API_URL.indexOf('COLE_AQUI') === 0) throw new Error('O site ainda não foi ligado à planilha (API_URL vazia).');
  if (!silencioso) carregando(true);
  try {
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ acao }, dados)) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Erro ao falar com o servidor.');
    return j;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('Sem internet ou servidor fora do ar. Tente de novo.');
    throw e;
  } finally { if (!silencioso) carregando(false); }
}
function confirmar(titulo, texto, okTxt = 'Confirmar', perigo){
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>${esc(titulo)}</h3><p style="color:var(--suave);margin:8px 0 0">${texto}</p>
      <div class="acoes"><button class="btn btn-borda btn-peq" data-r="0">Cancelar</button>
      <button class="btn ${perigo ? 'btn-vermelho' : 'btn-verde'} btn-peq" data-r="1">${esc(okTxt)}</button></div></div>`;
    bg.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b || e.target === bg){ bg.remove(); res(b ? b.dataset.r === '1' : false); } });
    document.body.appendChild(bg);
  });
}
function dataBR(d){ const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : d; }
const ESTRELA = (c = '#e9c27c', s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2c.8 5 3.2 7.6 8.5 10-5.3 2.4-7.7 5-8.5 10-.8-5-3.2-7.6-8.5-10C8.8 9.6 11.2 7 12 2z" fill="${c}"/></svg>`;
const PRESENTE = (s = 150) => `<svg width="${s}" height="${s}" viewBox="0 0 120 120"><rect x="18" y="50" width="84" height="58" rx="6" fill="#e9c27c"/><rect x="12" y="36" width="96" height="20" rx="5" fill="#f3d79e"/><rect x="54" y="36" width="12" height="72" fill="#b9483f"/><path d="M60 36c-10-22-36-24-32-8 3 11 20 10 32 8zM60 36c10-22 36-24 32-8-3 11-20 10-32 8z" fill="#b9483f"/><circle cx="60" cy="36" r="6" fill="#8f342d"/></svg>`;
function valorBR(v){ v = String(v || '').trim(); return /^\d+([.,]\d{1,2})?$/.test(v) ? 'R$ ' + v : v; }
const ICO_PESSOA = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>`;
const ICO_PRESENTE = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19M12 9v11.5M12 9c-1.5-3.5-6-4.3-6-1.6C6 9 9.5 9 12 9zm0 0c1.5-3.5 6-4.3 6-1.6C18 9 14.5 9 12 9z"/></svg>`;
function dominio(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return ''; } }

/* ---------- roteamento ----------
   #/                       organizador: grupos
   #/g/ID/organizador       organizador: painel do grupo
   #/s/ID                   participante: tela inicial do sorteio
   #/s/ID/eu                participante: nome, senha, sortear
   #/s/ID/quero             participante: o que quero ganhar
*/
window.addEventListener('hashchange', rota);
function rota(){
  window.scrollTo(0, 0); window.onbeforeunload = null;
  document.getElementById('topAcoes').innerHTML = '';
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const logo = document.getElementById('logo');
  if (p[0] === 's' && p[1]){
    logo.setAttribute('href', '#/s/' + p[1]);
    if (p[2] === 'eu') return telaEu(p[1]);
    if (p[2] === 'quero') return telaQuero(p[1]);
    return telaSorteio(p[1]);
  }
  logo.setAttribute('href', '#/');
  if (p[0] === 'g' && p[1]){
    if (p[2] === 'organizador') return telaOrganizador(p[1]);
    location.replace('#/s/' + p[1]); return;
  }
  return telaInicio();
}

function cartaoPedido(p){
  let corpo = '';
  const tams = [['Camiseta', p.camiseta], ['Shorts', p.shorts], ['Sapato', p.sapato]].filter(t => t[1]);
  const tamHtml = tams.length ? `<div class="tams">${tams.map(t => `<span>${t[0]} <b>${esc(t[1])}</b></span>`).join('')}</div>` : '';
  if (!p.preencheu) corpo = `<p class="nada">Ainda não contou o que quer ganhar.</p>`;
  else {
    const itens = (p.ideias || []).slice().sort((a, b) => (b.favorito ? 1 : 0) - (a.favorito ? 1 : 0));
    corpo = `
      ${p.surpreenda ? `<div class="surp">Me surpreenda: quem tirou escolhe o presente.</div>` : ''}
      ${itens.length ? `<ul class="itens">${itens.map(i => `<li class="${i.favorito ? 'fav' : ''}">
          ${i.texto ? `<div class="t">${i.favorito ? '★ ' : ''}${esc(i.texto)}</div>` : ''}
          ${i.link ? `<a class="loja" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">Ver na loja <small>${esc(dominio(i.link))}</small></a>` : ''}
        </li>`).join('')}</ul>` : ''}
      ${tamHtml}
      ${p.cores ? `<p class="dica"><b>Cores:</b> ${esc(p.cores)}</p>` : ''}
      ${p.dicas ? `<p class="dica"><b>Dica:</b> ${esc(p.dicas)}</p>` : ''}`;
  }
  return `<div class="card pedido"><h3>${esc(p.nome)}${p.preencheu ? '' : ' <span class="pill c" style="font-size:14px">aguardando</span>'}</h3>${corpo}</div>`;
}

function telaSenha(g, d, p){
  const novo = !p.temPin;
  let etapa = 1, primeira = '', digitos = '';
  const titulo = () => novo ? (etapa === 1 ? 'Crie sua senha' : 'Digite a senha de novo') : 'Digite sua senha';
  const texto = () => novo ? (etapa === 1 ? 'Escolha 4 números fáceis de lembrar. Não conte para ninguém.' : 'Só para confirmar que está certo.') : 'Os 4 números que você criou.';
  $app.innerHTML = `<div class="wrap"><section><div class="estreito" style="text-align:center">
    <p class="eyebrow" style="justify-content:center">Olá, ${esc(p.nome)}!</p>
    <h2 id="sTit"></h2><p class="sub" id="sTxt" style="font-size:19px"></p>
    <div class="pontos" id="pontos"><i></i><i></i><i></i><i></i></div>
    <div class="teclado">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
      <button class="apagar" data-n="x">⌫ Apagar</button><button data-n="0">0</button><span></span></div>
    ${novo ? '' : '<p class="sub" style="margin-top:20px">Esqueceu a senha? Fale com o organizador.</p>'}
    <button class="voltar" id="naoSou">← Não sou ${esc(p.nome)}</button>
  </div></section></div>`;
  const desenhar = () => {
    document.getElementById('sTit').textContent = titulo();
    document.getElementById('sTxt').textContent = texto();
    document.querySelectorAll('#pontos i').forEach((i, k) => i.classList.toggle('on', k < digitos.length));
  };
  const erro = msg => { toast(msg, true); const pt = document.getElementById('pontos'); pt.classList.remove('erro'); void pt.offsetWidth; pt.classList.add('erro'); digitos = ''; desenhar(); };
  desenhar();
  let ocupado = false;
  async function completo(){
    if (novo && etapa === 1){ primeira = digitos; etapa = 2; digitos = ''; return desenhar(); }
    if (novo && digitos !== primeira){ etapa = 1; primeira = ''; return erro('As senhas não ficaram iguais. Crie de novo.'); }
    ocupado = true;
    try {
      const r = await api(novo ? 'criarPin' : 'entrar', { g, pid: p.pid, pin: digitos });
      LS.set('sessao:' + g, JSON.stringify({ pid: p.pid, pin: digitos }));
      if (novo) toast('Senha criada!');
      painel(g, d.grupo, r.participante, digitos);
    } catch (e){ erro(e.message); }
    ocupado = false;
  }
  const tecla = n => {
    if (ocupado) return;
    if (n === 'x') digitos = digitos.slice(0, -1);
    else if (digitos.length < 4) digitos += n;
    desenhar();
    if (digitos.length === 4) setTimeout(completo, 150);
  };
  $app.querySelectorAll('.teclado button').forEach(b => b.addEventListener('click', () => tecla(b.dataset.n)));
  document.onkeydown = e => { if (!document.getElementById('pontos')) { document.onkeydown = null; return; } if (/^\d$/.test(e.key)) tecla(e.key); if (e.key === 'Backspace') tecla('x'); };
  document.getElementById('naoSou').addEventListener('click', () => telaNomes(g, d));
}

function girar(area, g, gr, eu, pin, r){
  const nomes = r.nomes.length ? r.nomes : [r.tirou.nome];
  area.innerHTML = `<div class="sorteio"><small>Sorteando…</small><div class="roleta" id="roleta"></div></div>`;

  let i = Math.floor(Math.random() * nomes.length), atraso = 60, total = 0;
  const passo = () => {
    el.textContent = nomes[i++ % nomes.length];
    total += atraso;
    if (total < 3000){ atraso *= 1.08; setTimeout(passo, atraso); }
    else setTimeout(() => {
      api('marcarVisto', { g, pid: eu.pid, pin }, true).catch(() => {});
      mostrarResultado(area, g, gr, eu, r, true);
    }, atraso);
  };
  passo();
}

/* ---------- o que eu quero ganhar ---------- */
const TAM_CAMISETA = ['PP','P','M','G','GG','XG','XGG'];
const TAM_SHORTS = ['PP','P','M','G','GG','XG','XGG','36','38','40','42','44','46','48','50'];
const TAM_SAPATO = Array.from({ length: 16 }, (_, i) => String(31 + i));

async function telaQuero(g){
  const s = sessao(g);
  if (!s){ location.replace('#/s/' + g + '/eu'); return; }

  } catch (e){ sair(g); location.replace('#/s/' + g + '/eu'); return; }
  let surpreenda = eu.surpreenda;
  let itens = (eu.ideias || []).map(i => Object.assign({}, i));
  if (!itens.length) itens.push({ texto:'', link:'', favorito:false });
  const tam = { camiseta: eu.camiseta || '', shorts: eu.shorts || '', sapato: eu.sapato || '' };
  let mudou = false;
  const sujo = () => { mudou = true; window.onbeforeunload = () => true; };

  $app.innerHTML = `<div class="wrap"><section style="padding-top:28px"><div class="estreito">
    <a class="voltar" href="#/s/${esc(g)}/eu" style="padding-top:0">← Voltar</a>
    <h2>O que você quer ganhar?</h2>

      <button id="opSur">Me surpreenda<small>Quem me tirou escolhe</small></button>

    <div id="blocoSug"></div>
    <div id="avisoSur"></div>
    <div class="card" style="margin-top:22px">
      <h3>Seus tamanhos</h3>
      <p class="sub" id="tamInfo"></p>
      ${['camiseta','shorts','sapato'].map(k => `<span class="rotulo">${k[0].toUpperCase() + k.slice(1)}</span>
        <div class="grade" data-k="${k}">${({camiseta:TAM_CAMISETA, shorts:TAM_SHORTS, sapato:TAM_SAPATO})[k].map(v => `<button data-v="${v}">${v}</button>`).join('')}</div>`).join('')}

  function desenharModo(){
    document.getElementById('opSug').classList.toggle('on', !surpreenda);
    document.getElementById('opSur').classList.toggle('on', surpreenda);
    document.getElementById('blocoSug').style.display = surpreenda ? 'none' : '';
    document.getElementById('avisoSur').innerHTML = surpreenda ? `<div class="aviso v" style="font-size:18px">Combinado: quem te tirou vai escolher. <b>Só falta escolher os 3 tamanhos abaixo.</b></div>` : '';
    document.getElementById('tamInfo').innerHTML = surpreenda ? '<b style="color:var(--vermelho)">Obrigatório: toque nos 3 tamanhos.</b>' : 'Opcional. Ajuda quem vai te dar roupa ou calçado.';
  }

      return;
    }
    // separa link colado dentro do texto
    const lista = itens.map(i => {
      let texto = (i.texto || '').trim(), link = (i.link || '').trim();
      if (!link){ const m = texto.match(/(https?:\/\/\S+|www\.\S+)/i); if (m){ link = m[1]; texto = texto.replace(m[1], '').trim().replace(/[-–:]\s*$/, '').trim(); } }
      return { texto, link, favorito: !!i.favorito };
    }).filter(i => i.texto || i.link);
    try {
      await api('salvarLista', { g, pid: eu.pid, pin: s.pin, dados: { surpreenda, camiseta: tam.camiseta, shorts: tam.shorts, sapato: tam.sapato, cores: '', dicas: document.getElementById('dicas').value, ideias: lista } });
      window.onbeforeunload = null;
      toast('Salvo.');
      location.hash = '#/s/' + g + '/eu';
    } catch (e){ toast(e.message, true); }
  });
}

/* ---------- imagem para baixar ---------- */
function baixarImagem(meuNome, alvo, grupo){
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'), fonte = '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';
  const grad = x.createLinearGradient(0, 0, W, H); grad.addColorStop(0, '#1f5c45'); grad.addColorStop(1, '#122f26');
  x.fillStyle = grad; x.fillRect(0, 0, W, H);
  const estrela = (cx, cy, r, cor, a) => { x.save(); x.globalAlpha = a; x.fillStyle = cor; x.beginPath();
    x.moveTo(cx, cy - r); x.quadraticCurveTo(cx + r * .12, cy - r * .12, cx + r * .9, cy); x.quadraticCurveTo(cx + r * .12, cy + r * .12, cx, cy + r);
    x.quadraticCurveTo(cx - r * .12, cy + r * .12, cx - r * .9, cy); x.quadraticCurveTo(cx - r * .12, cy - r * .12, cx, cy - r); x.fill(); x.restore(); };
  let sd = 7; const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 38; i++) estrela(rnd() * W, rnd() * H, 6 + rnd() * 16, '#e9c27c', .15 + rnd() * .35);
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  x.fillStyle = '#fffdf8'; rr(90, 250, W - 180, 760, 46); x.fill();
  x.fillStyle = '#b9483f'; x.fillRect(W / 2 - 28, 250, 56, 760);
  x.fillStyle = '#fffdf8'; rr(150, 460, W - 300, 520, 30); x.fill();
  x.textAlign = 'center';
  x.fillStyle = '#e9c27c'; x.font = `800 34px ${fonte}`; x.fillText('AMIGO SECRETO', W / 2, 120);
  x.fillStyle = '#ffffff'; x.font = `700 44px ${fonte}`; x.fillText(cortar(x, grupo.nome, W - 160), W / 2, 185);
  x.fillStyle = '#5f6964'; x.font = `600 38px ${fonte}`; x.fillText(cortar(x, meuNome + ', você tirou:', W - 380), W / 2, 545);
  x.fillStyle = '#173d31'; let t = 130; x.font = `800 ${t}px ${fonte}`;
  while (x.measureText(alvo.nome).width > W - 400 && t > 50){ t -= 4; x.font = `800 ${t}px ${fonte}`; }
  x.fillText(cortar(x, alvo.nome, W - 380), W / 2, 680);
  estrela(W / 2, 745, 26, '#b9483f', 1);
  const tams = [['Camiseta', alvo.camiseta], ['Shorts', alvo.shorts], ['Sapato', alvo.sapato]];
  if (tams.some(v => v[1])){
    tams.forEach((v, i) => { const cx = 290 + i * 250;
      x.fillStyle = '#f2ede3'; rr(cx - 105, 830, 210, 120, 24); x.fill();
      x.fillStyle = '#5f6964'; x.font = `700 24px ${fonte}`; x.fillText(v[0].toUpperCase(), cx, 873);
      x.fillStyle = '#173d31'; x.font = `800 42px ${fonte}`; x.fillText(v[1] || '—', cx, 925); });
  } else { x.fillStyle = '#5f6964'; x.font = `600 30px ${fonte}`; x.fillText('Veja o que a pessoa quer ganhar no site', W / 2, 900); }
  const info = [grupo.data ? 'Revelação: ' + dataBR(grupo.data) : '', grupo.valor ? 'Valor: ' + valorBR(grupo.valor) : ''].filter(Boolean).join('   ·   ');
  x.fillStyle = '#ffffff'; x.font = `600 34px ${fonte}`; if (info) x.fillText(info, W / 2, 1095);
  x.fillStyle = '#e9c27c'; x.font = `700 30px ${fonte}`; x.fillText('Não conte para ninguém', W / 2, 1170);
  x.fillStyle = 'rgba(255,255,255,.6)'; x.font = `600 24px ${fonte}`; x.fillText('Amigo secreto - Digital', W / 2, 1280);
  cv.toBlob(blob => {
    const nome = 'amigo-secreto-' + meuNome.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Imagem baixada! Veja na galeria ou em Downloads.');
  }, 'image/png');
}
function cortar(x, t, max){ t = String(t || ''); if (x.measureText(t).width <= max) return t; while (t.length > 1 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; }

function existeSorteio(ids, proib){
  if (ids.length < 2) return false;
  const dono = {};
  function tentar(a, visit){
    for (const b of ids){
      if (b === a || proib[a + '|' + b] || visit[b]) continue;
      visit[b] = true;
      if (!dono[b] || tentar(dono[b], visit)){ dono[b] = a; return true; }
    }
    return false;
  }
  return ids.every(a => tentar(a, {}));
}

const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

function admNomes({ g, senha, d, recarregar }){
  const c = document.getElementById('admC'), trav = d.grupo.sorteado;
  let lista = d.participantes.map(p => ({ pid: p.pid, nome: p.nome }));
  c.innerHTML = `${trav ? '<div class="aviso o">O sorteio já foi liberado, então os nomes estão travados. Para mudar, desfaça em "3. Liberar e enviar".</div>' : ''}

      <h3>Coloque os nomes</h3>
      <p class="sub">Um nome por linha (pode colar a lista toda). Nomes iguais não são aceitos.</p>
      <textarea id="novos" placeholder="Ana&#10;Bruno&#10;Vó Maria" style="margin-top:12px"></textarea>
      <button class="btn btn-borda btn-peq" id="addNomes" style="margin-top:10px">+ Colocar na lista</button>

    document.getElementById('qtd').textContent = lista.length;
    document.getElementById('admLista').innerHTML = lista.map((p, i) => `<div class="adm-item"><span class="n">${i + 1}</span>
      <input type="text" maxlength="40" value="${esc(p.nome)}" data-i="${i}"><button class="x" data-rm="${i}">✕</button></div>`).join('') || '<p class="sub">Nenhum nome ainda.</p>';
  };
  const sujo = () => { window.onbeforeunload = () => true; };
  desenhar();
  document.getElementById('addNomes').addEventListener('click', () => {
    const ta = document.getElementById('novos'), rep = [];
    ta.value.split(/\n|;/).map(s => s.trim()).filter(Boolean).forEach(n => {
      if (lista.some(p => norm(p.nome) === norm(n))) rep.push(n); else lista.push({ nome: n.slice(0, 40) });
    });
    ta.value = rep.join('\n');
    if (rep.length) toast('Já estão na lista: ' + rep.join(', ') + '. Diferencie (ex.: "Ana S.").', true);
    desenhar(); sujo();
  });

  document.getElementById('admLista').addEventListener('click', async e => {
    const rm = e.target.closest('[data-rm]'); if (!rm) return;
    const p = lista[+rm.dataset.rm];
    if (p.pid && !(await confirmar('Tirar ' + p.nome + '?', 'Os pedidos e restrições dessa pessoa serão apagados ao salvar.', 'Tirar', true))) return;
    lista.splice(+rm.dataset.rm, 1); desenhar(); sujo();
  });
  document.getElementById('salvarNomes').addEventListener('click', async () => {
    const vistos = {};
    for (const p of lista){ const k = norm(p.nome || ''); if (!k) return toast('Há um nome vazio.', true); if (vistos[k]) return toast('O nome "' + p.nome + '" está repetido.', true); vistos[k] = 1; }
    try { const nd = await api('admSalvarParticipantes', { g, senha, participantes: lista }); toast('Nomes salvos!'); recarregar(nd, 'nomes'); }
    catch (e){ toast(e.message, true); }
  });
}

      <p class="sub">Apaga nomes, pedidos e sorteio. Não dá para desfazer. Libera uma vaga (limite de 5 grupos).</p>
      <span class="rotulo">Escreva o nome do grupo para confirmar</span><input type="text" id="confNome" placeholder="${esc(gr.nome)}">
      <button class="btn btn-vermelho btn-full" id="apagar" style="margin-top:14px">Apagar grupo</button>
    </div>`;
  document.getElementById('fCfg').addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { const nd = await api('admSalvarConfig', { g, senha, nome: f.get('nome'), data: f.get('data'), valor: f.get('valor') }); toast('Salvo!'); recarregar(nd, 'ajustes'); } catch (err){ toast(err.message, true); }
  });
  document.getElementById('apagar').addEventListener('click', async () => {
    if (document.getElementById('confNome').value.trim() !== gr.nome) return toast('Escreva o nome do grupo igualzinho para confirmar.', true);
    if (!(await confirmar('Apagar de vez?', 'Isso não pode ser desfeito.', 'Apagar grupo', true))) return;
    try { await api('admApagarGrupo', { g, senha }); toast('Grupo apagado.'); location.hash = '#/'; } catch (e){ toast(e.message, true); }
  });
}

rota();
</script>
</body>
</html>
